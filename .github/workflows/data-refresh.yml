name: Data Refresh

on:
  schedule:
    - cron: "0 6,18 * * *" # UTC 06:00/18:00 = JST 15:00/03:00
  workflow_dispatch:
    inputs:
      mode:
        description: "Fetch mode"
        required: false
        default: "daily"
        type: choice
        options:
          - daily
          - now
          - backfill
          - full

permissions:
  contents: write

jobs:
  data-refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch outages
        run: npx tsx scripts/fetch-outages.ts --mode "${{ inputs.mode || 'daily' }}"

      - name: Fetch units
        run: npx tsx scripts/fetch-units.ts

      - name: Sync public data
        run: npx tsx scripts/sync-public-data.ts

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet data/ public/data/ || echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/normalized/ public/data/
          git commit -m "chore: update outage data [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
